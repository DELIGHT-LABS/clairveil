syntax = "proto3";
package clairveil.privacy.v1;

option go_package = "github.com/DELIGHT-LABS/clairveil/x/privacy/types";

// GenesisState defines the bank module's genesis state.
message GenesisState {
  repeated bytes commitments = 1;
  repeated bytes historical_roots = 2;
  repeated bytes nullifiers = 3;
  bytes audit_master_pubkey = 4;
  CircuitSetIdentity circuit_set_identity = 5;
  repeated AssetRegistryEntryV1 asset_registry = 6;
  uint64 privacy_global_sequence = 7;
  repeated PrivacyEventRecordV1 privacy_events = 8;
  repeated PrivacyScanSummaryV2 privacy_scan_summaries = 9;
  repeated PrivacyScanOutputV2 privacy_scan_outputs = 10;
  repeated MerkleRootSnapshotV1 merkle_root_snapshots = 11;
  repeated ReserveBalanceV1 reserve_balances = 12;
  uint32 state_version = 13;
  string audit_key_id = 14;
  uint64 audit_key_epoch = 15;
}

// AssetRegistryEntryV1 is the consensus 1:1 mapping between a canonical
// Cosmos denom and its canonical 32-byte NoteV1 asset ID.
message AssetRegistryEntryV1 {
  string canonical_denom = 1;
  bytes asset_id = 2;
}

// PrivacyScanCursorV1 is ordered lexicographically by
// (height, global_sequence, output_index). It is shared by Deposit,
// JoinSplit2x2, and BatchJoinSplit16x32 operations.
message PrivacyScanCursorV1 {
  int64 height = 1;
  uint64 global_sequence = 2;
  uint32 output_index = 3;
}

message PrivacyEventAttributeV1 {
  string key = 1;
  string value = 2;
}

// PrivacyEventRecordV1 preserves the legacy indexed event feed across genesis
// export/import. New batch payload bytes must not be copied into attributes.
message PrivacyEventRecordV1 {
  uint64 global_sequence = 1;
  int64 height = 2;
  bytes tx_hash = 3;
  string event_type = 4;
  repeated PrivacyEventAttributeV1 attributes = 5;
}

// PrivacyScanSummaryV2 is stored once for a logical privacy operation.
message PrivacyScanSummaryV2 {
  uint64 global_sequence = 1;
  int64 height = 2;
  bytes tx_hash = 3;
  string event_type = 4;
  repeated bytes nullifiers = 5;
  uint32 output_count = 6;
  string circuit_set_id = 7;
  string payload_version = 8;
  string scan_schema_version = 9;
  string audit_key_id = 10;
  uint64 audit_key_epoch = 11;
  bytes audit_target_pubkey = 12;
  bytes effect_id = 13;
}

// PrivacyScanOutputV2 stores raw bytes exactly once per output. Its key and
// body both carry the shared cursor so corrupt/mis-keyed records fail closed.
message PrivacyScanOutputV2 {
  uint64 global_sequence = 1;
  int64 height = 2;
  uint32 output_index = 3;
  bytes effect_id = 4;
  bytes commitment = 5;
  bytes ciphertext = 6;
  bytes encrypted_note = 7;
  bytes view_tag = 8;
  uint64 leaf_index = 9;
  bool leaf_index_found = 10;
  uint32 user_privacy_policy = 11;
  string user_disclosure_mode = 12;
  bytes user_disclosure_digest = 13;
  bytes user_disclosure_target_pubkey = 14;
  bytes user_disclosure_payload = 15;
  bytes full_disclosure_digest = 16;
  bytes audit_disclosure_payload = 17;
  bytes self_view_disclosure_payload = 18;
  string circuit_set_id = 19;
  string payload_version = 20;
  string scan_schema_version = 21;
  string audit_key_id = 22;
  uint64 audit_key_epoch = 23;
  bytes audit_target_pubkey = 24;
  bytes tx_hash = 25;
  string event_type = 26;
}

// MerkleRootSnapshotV1 binds a historical root to the exact commitment prefix
// and block height needed to build all requested paths from one snapshot.
message MerkleRootSnapshotV1 {
  bytes root = 1;
  uint64 leaf_count = 2;
  int64 height = 3;
}

message ReserveBalanceV1 {
  string canonical_denom = 1;
  string total_deposited = 2;
  string total_withdrawn = 3;
}

message CircuitIdentity {
  string circuit_id = 1;
  string verifying_key_sha256 = 2;
  string public_input_schema_sha256 = 3;
}

message CircuitSetIdentity {
  string schema_version = 1;
  string circuit_set_id = 2;
  string curve = 3;
  repeated CircuitIdentity circuits = 4;
}
