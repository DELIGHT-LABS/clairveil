syntax = "proto3";
package clairveil.privacy.v1;

import "cosmos/msg/v1/msg.proto";

option go_package = "github.com/DELIGHT-LABS/clairveil/x/privacy/types";

// Msg 서비스 정의
service Msg {
  option (cosmos.msg.v1.service) = true;

  // Deposit: 투명 자산 -> 익명 자산 (Note)
  rpc Deposit(MsgDeposit) returns (MsgDepositResponse);

  // Withdraw: 익명 자산 -> 투명 자산
  rpc Withdraw(MsgWithdraw) returns (MsgWithdrawResponse);

  // Transfer: shielded pool 내부 전송
  rpc Transfer(MsgTransfer) returns (MsgTransferResponse);

  // BatchTransfer: one-proof 1..16 input / 1..32 output shielded transfer
  rpc BatchTransfer(MsgBatchTransfer) returns (MsgBatchTransferResponse);
}

enum UserDisclosureMode {
  USER_DISCLOSURE_MODE_NONE = 0;
  USER_DISCLOSURE_MODE_PUBLIC = 1;
  USER_DISCLOSURE_MODE_RECIPIENT_ENCRYPTED = 2;
}

// MsgDeposit: 투명 자산 -> 익명 자산 변환
message MsgDeposit {
  option (cosmos.msg.v1.signer) = "creator";

  string creator = 1;        // 입금자
  string amount = 2;         // 금액 (예: 100uclair)
  bytes note_commitment = 3; // 머클 트리에 들어갈 해시
  bytes encrypted_note = 4;  // 복구용 암호화 데이터
  bytes proof = 5;           // commitment가 amount/asset에 묶였다는 ZK proof
}

// MsgWithdraw: 익명 자산 -> 투명 자산 변환
message MsgWithdraw {
  option (cosmos.msg.v1.signer) = "creator";

  string creator = 1;
  bytes proof = 2;      // ZK Proof
  bytes root = 3;       // 참조한 머클 루트
  bytes nullifier = 4;  // 이중 지불 방지 태그
  reserved 5, 6;        // legacy output-note fields; withdraw creates no note
  reserved "new_note_commitment", "encrypted_note";
  string amount = 7;    // 출금 금액 (예: 100uclair)
  string recipient = 8; // 출금 주소
  string chain_id = 9;
  int64 expires_at_unix = 10;
}

// MsgTransfer: 내부 전송
message MsgTransfer {
  option (cosmos.msg.v1.signer) = "creator";

  string creator = 1;

  // ZK Proof Data
  bytes proof = 2;
  bytes root = 3;                // Merkle Root
  repeated bytes nullifiers = 4; // Spent Note's Nullifier

  // Output Commitments (Recipient, Change)
  repeated bytes new_commitments = 5;

  // On-chain Encryption (ECDH Encrypted Data)
  // 수신자가 복호화해서 Note 정보를 알 수 있게 함
  repeated bytes cipher_texts = 6;

  // Optional user selective disclosure.
  // 0x00: all-private
  // 0x01: disclose amount (+ asset id)
  // 0x02: disclose recipient full shielded address
  // 0x04: disclose sender full shielded address
  uint32 user_privacy_policy = 7;
  bytes user_disclosure_digest = 8;
  UserDisclosureMode user_disclosure_mode = 9;
  bytes user_disclosure_target_pubkey = 10;
  bytes user_disclosure_payload = 11;

  // Mandatory master-auditor disclosure.
  bytes audit_disclosure_digest = 12;
  bytes audit_disclosure_target_pubkey = 13;
  bytes audit_disclosure_payload = 14;

  // Optional sender self-view disclosure.
  // The payload is encrypted to the sender's own disclosure key. The target
  // public key is intentionally omitted to avoid sender clustering.
  bytes self_view_disclosure_digest = 15;
  bytes self_view_disclosure_payload = 16;

  // Per-output scan performance tags. The exact tag bytes are bound to the
  // owner-authorized payload digest and proof, but the circuit does not
  // constrain their derivation from encrypted-output key material. Wallets
  // must treat ownership semantics as untrusted hints. Safe default scans must
  // full-decrypt on tag mismatch; explicit fast modes may skip well-formed
  // mismatches only when recovery/rescan policy is in place.
  repeated bytes view_tags = 17;

  // Absolute authorization expiry. The owner signature and proof bind this
  // value; the transaction is expired when block_time >= expires_at_unix.
  int64 expires_at_unix = 18;
}

// MsgBatchTransfer performs one atomic 1..16 input / 1..32 output shielded
// JoinSplit. Field numbers and meanings form the version-1 batch-transfer wire
// contract. Counts are derived exclusively from the repeated field lengths.
message MsgBatchTransfer {
  option (cosmos.msg.v1.signer) = "creator";

  string creator = 1;
  bytes proof = 2;
  bytes root = 3;
  repeated bytes nullifiers = 4;
  repeated BatchTransferOutput outputs = 5;
  // Canonical lowercase ASCII [a-z0-9][a-z0-9._-]*, 1..64 bytes.
  string audit_key_id = 6;
  uint64 audit_key_epoch = 7;
  bytes audit_disclosure_target_pubkey = 8;
  int64 expires_at_unix = 9;
}

// BatchTransferOutput carries exactly one ordered output effect. The full
// disclosure digest is shared by mandatory audit and optional self-view
// disclosure payloads; a separate self-view target or digest is not exposed.
message BatchTransferOutput {
  bytes commitment = 1;
  bytes ciphertext = 2;
  bytes view_tag = 3;
  uint32 user_privacy_policy = 4;
  UserDisclosureMode user_disclosure_mode = 5;
  bytes user_disclosure_digest = 6;
  bytes user_disclosure_target_pubkey = 7;
  bytes user_disclosure_payload = 8;
  bytes full_disclosure_digest = 9;
  bytes audit_disclosure_payload = 10;
  bytes self_view_disclosure_payload = 11;
}

// MsgDepositResponse
message MsgDepositResponse {}

// MsgWithdrawResponse
message MsgWithdrawResponse {}

// MsgTransferResponse
message MsgTransferResponse {}

// MsgBatchTransferResponse is empty because all scan/output data is stored in
// typed state and queried separately.
message MsgBatchTransferResponse {}
